[OpenAI]

API_TYPE=gemini

# Check Azure's documentation for updates here:
# https://learn.microsoft.com/en-us/azure/ai-services/openai/chatgpt-quickstart?tabs=command-line&pivots=programming-language-python
# https://learn.microsoft.com/en-us/azure/ai-foundry/openai/api-version-lifecycle?tabs=python
AZURE_API_VERSION=2024-12-01-preview

#
# Model parameters
#

# For Gemini
MODEL=models/gemini-2.5-flash
REASONING_MODEL=models/gemini-3.1-pro-preview
# Use OpenAI embedding model for LlamaIndex compatibility
EMBEDDING_MODEL=text-embedding-3-small

# For OpenAI (legacy)
# MODEL=gpt-5-mini
# EMBEDDING_MODEL=text-embedding-3-small
MAX_COMPLETION_TOKENS= 128000
TIMEOUT=240
MAX_ATTEMPTS=2
WAITING_TIME=2
EXPONENTIAL_BACKOFF_FACTOR=5

# Azure embedding model API version
AZURE_EMBEDDING_MODEL_API_VERSION=2023-05-15

# Concurrency control
MAX_CONCURRENT_MODEL_CALLS=4

# Caching
CACHE_API_CALLS=False
CACHE_FILE_NAME=openai_api_cache.pickle

[Ollama]
OLLAMA_BASE_URL=http://localhost:11434/v1
OLLAMA_MODEL=qwen3:8b
OLLAMA_TIMEOUT=300

[Logging]
LOGLEVEL=DEBUG
# ERROR
# WARNING
# INFO
# DEBUG

LOG_INCLUDE_THREAD_ID=True